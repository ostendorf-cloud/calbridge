extends: default

ignore:
  # Helm template files use Go template syntax ({{ }}), which is not valid
  # plain YAML; values.yaml, Chart.yaml, values.schema.json and tests/ stay
  # linted. Matches solobill's own .yamllint.yaml.
  - charts/*/templates/
  # Installed dependencies and the lockfile pnpm writes are not ours to lint.
  # Matches solobill's own .yamllint.yaml.
  - web/node_modules/
  - web/pnpm-lock.yaml

rules:
  line-length:
    max: 140
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
