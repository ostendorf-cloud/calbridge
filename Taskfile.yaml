version: "3"

# Shared AGENTS.md line check. The tag and the checksum move by hand together.
# CI and a run without a terminal need --trusted-hosts github.com for the remote include.
# The shared task reads MODE from here, so a local run and CI both fail on a long file.
vars:
  MODE: fail

includes:
  shared:
    taskfile: https://github.com/ostendorf-cloud/workflows.git//taskfiles/agents-md.yaml?ref=v0.9.0
    checksum: 9309c557cf02835bfef5932ad1c07e3d63325b0d4fa523df5b53befbc9834410
    flatten: true

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  # cmd/calbridge embeds web/'s build output and cmd/calbridge-landing embeds
  # web-landing/'s, so both go:embed directives fail on an empty dist/
  # unless both frontends exist first: "go vet ./..." and
  # "golangci-lint run ./..." both reach every package in the module,
  # cmd/calbridge-landing included.
  lint:vet:
    desc: Go vet
    deps: [web:build, landing-web:build]
    cmds:
      - go vet ./...

  lint:golangci:
    desc: golangci-lint run
    deps: [web:build, landing-web:build]
    cmds:
      - golangci-lint run ./...

  generate:sqlc:
    desc: Regenerate the sqlc query code under internal/storage/postgres/sqlcgen
    cmds:
      - sqlc generate

  # sqlc reads its schema from db/migrations itself (see sqlc.yaml), parsed
  # statically, so this needs no database and no network.
  generate:check:
    desc: Fail if the committed sqlc output does not match a fresh generate
    deps: [generate:sqlc]
    cmds:
      - |
        if [ -n "$(git status --porcelain -- internal/storage/postgres/sqlcgen)" ]; then
          echo "sqlc output is out of date; run 'task generate:sqlc' and commit the result:" >&2
          git status --porcelain -- internal/storage/postgres/sqlcgen >&2
          git diff -- internal/storage/postgres/sqlcgen >&2
          exit 1
        fi

  # Needs a reachable Postgres via DATABASE_URL, so it is never part of
  # check: check binds no port. The checks.yaml
  # "integration" job runs this against a real postgres:18 service
  # container, after applying the migrations with dbmate.
  test:integration:
    desc: Go test against a live Postgres (DATABASE_URL), including the row level security isolation test
    cmds:
      - go test -tags=integration -race -count=1 ./internal/...

  # Needs both frontends on disk, so it is its own target rather than
  # part of test:go or check:govue-version: the two tests behind the
  # builtfrontend tag read cmd/calbridge/dist and cmd/calbridge-landing/dist,
  # and loading cmd/calbridge-landing at all needs its embedded dist. This
  # is the same shape test:integration has for its Postgres: a precondition
  # the cheap jobs cannot meet gets its own target and its own CI job,
  # never a skip inside the test. The deps below are what makes the
  # precondition hold wherever this target runs.
  test:builtfrontend:
    desc: Go test over the checks that read the built frontends, building both first
    deps: [web:build, landing-web:build]
    cmds:
      - go test -tags=builtfrontend -race -count=1 ./internal/depsync/...

  build:
    desc: Compile the calbridge binary
    deps: [web:build]
    cmds:
      - go build -o bin/calbridge ./cmd/calbridge

  build:image:
    desc: Build the container image, without pushing it anywhere
    cmds:
      - docker build .

  # cmd/calbridge-landing's own build, separate from build above so a
  # correction to the privacy policy's text can be verified and released
  # without touching the application's own binary or image.
  landing:build:
    desc: Compile the calbridge-landing binary
    deps: [landing-web:build]
    cmds:
      - go build -o bin/calbridge-landing ./cmd/calbridge-landing

  landing:build:image:
    desc: Build the landing server's own container image, without pushing it anywhere
    cmds:
      - docker build -f Dockerfile.landing .

  test:go:
    desc: Go test
    deps: [web:build, landing-web:build]
    cmds:
      - go test -race -count=1 ./...

  check:govue-version:
    desc: Verify the govue version pin and the Dockerfile's pnpm pin each match their other half
    cmds:
      - go test -race -count=1 ./internal/depsync/...

  # The web/ half. Every target below runs inside web/ and depends on web:deps,
  # so one of them on its own is enough in a fresh checkout and in CI.
  web:deps:
    desc: Install the web/ dependencies
    dir: web
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  web:lint:
    desc: ESLint over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run lint

  web:format:
    desc: Prettier format check over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format:check

  web:types:
    desc: TypeScript and template typecheck of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run typecheck

  web:test:
    desc: Vitest suite of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run test

  web:build:
    desc: Build the SPA bundle into cmd/calbridge/dist
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run build

  web:format:write:
    desc: Format the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format

  # The web-landing/ half: the public landing page's own build, with its
  # own lint, format, types, test and build targets rather than folded
  # into the web:* ones above, since the two are separate packages with
  # separate dependencies, separate pnpm-lock.yaml files and separate
  # go:embed targets. Every target below runs inside web-landing/ and
  # depends on landing-web:deps, so one of them on its own is enough in a
  # fresh checkout and in CI.
  landing-web:deps:
    desc: Install the web-landing/ dependencies
    dir: web-landing
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  landing-web:lint:
    desc: ESLint over the web-landing/ package
    dir: web-landing
    deps: [landing-web:deps]
    cmds:
      - pnpm run lint

  landing-web:format:
    desc: Prettier format check over the web-landing/ package
    dir: web-landing
    deps: [landing-web:deps]
    cmds:
      - pnpm run format:check

  landing-web:types:
    desc: TypeScript and template typecheck of the web-landing/ package
    dir: web-landing
    deps: [landing-web:deps]
    cmds:
      - pnpm run typecheck

  landing-web:test:
    desc: Vitest suite of the web-landing/ package
    dir: web-landing
    deps: [landing-web:deps]
    cmds:
      - pnpm run test

  landing-web:build:
    desc: Build the landing SPA bundle into cmd/calbridge-landing/dist
    dir: web-landing
    deps: [landing-web:deps]
    cmds:
      - pnpm run build

  landing-web:format:write:
    desc: Format the web-landing/ package
    dir: web-landing
    deps: [landing-web:deps]
    cmds:
      - pnpm run format

  lint:helm:
    desc: Helm chart lint and schema validation
    cmds:
      - scripts/validate-chart.sh lint

  validate:kubeconform:
    desc: Schema validation of the rendered Helm chart against the Kubernetes API
    cmds:
      - scripts/validate-chart.sh kubeconform

  # helm only finds a plugin inside HELM_PLUGINS. The mise entry's postinstall copies
  # helm-unittest into helm's own plugin directory, but that hook runs only on a fresh
  # install: a cached tool skips it, and CI then fails with "unknown command unittest".
  # This builds a plugin directory holding exactly one entry, pointing at whatever mise
  # resolved, so the target no longer depends on the hook having run. mise's install
  # parent cannot be used directly: it also holds the version aliases, and helm then
  # sees several plugins all claiming the same name.
  helm:plugins:
    desc: Link helm-unittest into a plugin directory helm can read
    internal: true
    run: once
    cmds:
      - rm -rf .task/helm-plugins
      - mkdir -p .task/helm-plugins
      - ln -s "$(mise where 'github:helm-unittest/helm-unittest')" .task/helm-plugins/unittest

  test:helm:
    desc: Helm chart unit tests
    deps: [helm:plugins]
    env:
      HELM_PLUGINS: .task/helm-plugins
    cmds:
      - helm unittest charts/calbridge

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:vet
      - task: lint:golangci
      - task: generate:check
      - task: lint:markdown
      - task: lint:agents-md
      - task: lint:yaml
      - task: lint:actions
      - task: lint:secrets
      - task: web:lint
      - task: web:format
      - task: web:types
      - task: web:test
      - task: web:build
      - task: landing-web:lint
      - task: landing-web:format
      - task: landing-web:types
      - task: landing-web:test
      - task: landing-web:build
      - task: build
      - task: build:image
      - task: landing:build
      - task: landing:build:image
      - task: test:go
      - task: test:builtfrontend
      - task: check:govue-version
      - task: lint:helm
      - task: validate:kubeconform
      - task: test:helm
