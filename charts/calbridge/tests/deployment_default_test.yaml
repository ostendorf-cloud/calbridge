suite: default deployment
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/serviceaccount.yaml
  - templates/ingress.yaml
  - templates/httproute.yaml
tests:
  - it: renders exactly one Deployment
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders exactly one Service
    template: templates/service.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders exactly one ServiceAccount
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders no Ingress by default
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no HTTPRoute by default
    template: templates/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: sets the configured listen address and log level
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"

  - it: runs as non root with a read only root filesystem and no capabilities
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: mounts no service account token
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: has no startup probe but has liveness and readiness probes on the right paths
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
