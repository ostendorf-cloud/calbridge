suite: default deployment
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/serviceaccount.yaml
  - templates/ingress.yaml
  - templates/httproute.yaml
  - templates/migration-job.yaml
  - templates/migration-configmap.yaml
set:
  existingSecret:
    name: calbridge-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/calbridge?sslmode=require"
    databaseUser: calbridge_app
  migrationJob:
    databaseUser: calbridge_migrator
tests:
  - it: renders exactly one Deployment
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders exactly one Service
    template: templates/service.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders exactly one ServiceAccount
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders no Ingress by default
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no HTTPRoute by default
    template: templates/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: sets the configured listen addresses, drain delay and log level
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_LISTEN_ADDR
            value: ":8081"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRAIN_DELAY
            value: "5s"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"

  - it: wires the required secret-backed database and encryption env vars with no fallback
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: "postgres://postgres.example.svc:5432/calbridge?sslmode=require"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_USER
            value: calbridge_app
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: calbridge-secrets
                key: DATABASE_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: calbridge-secrets
                key: ENCRYPTION_KEY

  - it: renders exactly one migration Job by default
    template: templates/migration-job.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: embeds every migration from db/migrations into the ConfigMap
    template: templates/migration-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data["20261113155247_create_users.sql"]
          pattern: "CREATE TABLE users"

  - it: trusts no proxy for the login rate limiter by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXY_CIDRS
            value: ""

  - it: passes a configured trusted proxy CIDR through to the login rate limiter
    template: templates/deployment.yaml
    set:
      config.trustedProxyCIDRs: "10.0.0.0/8"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXY_CIDRS
            value: "10.0.0.0/8"

  - it: runs as non root with a read only root filesystem and no capabilities
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: mounts no service account token
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: has no startup probe but has liveness and readiness probes on the admin port
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: admin
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: admin

  - it: has both the public and the admin container port
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: admin
            containerPort: 8081
            protocol: TCP

  - it: sets an explicit termination grace period above the drain window
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: keeps the readiness drain window inside the configured drain delay
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 2
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 1
