suite: startup probe enabled
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: calbridge-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/calbridge?sslmode=require"
    databaseUser: calbridge_app
  startupProbe:
    enabled: true
tests:
  - it: renders a startup probe against the admin port on the right path
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: admin
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: still renders the liveness and readiness probes
    asserts:
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
