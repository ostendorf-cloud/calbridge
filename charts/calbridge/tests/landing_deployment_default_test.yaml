suite: default landing deployment
templates:
  - templates/landing-deployment.yaml
  - templates/landing-service.yaml
  - templates/landing-serviceaccount.yaml
  - templates/landing-ingress.yaml
  - templates/landing-httproute.yaml
set:
  existingSecret:
    name: calbridge-secrets
  landing:
    config:
      appUrl: "https://app.calbridge.example.org"
      operator:
        name: "Example Operator"
        street: "Example Street 1"
        postalCode: "12345"
        city: "Example City"
        email: "legal@calbridge.example.org"
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/calbridge?sslmode=require"
    databaseUser: calbridge_app
  migrationJob:
    databaseUser: calbridge_migrator
tests:
  - it: renders exactly one landing Deployment
    template: templates/landing-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders exactly one landing Service
    template: templates/landing-service.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders exactly one landing ServiceAccount
    template: templates/landing-serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders no landing Ingress by default
    template: templates/landing-ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no landing HTTPRoute by default
    template: templates/landing-httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: names the landing Deployment distinctly from the application's own
    template: templates/landing-deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-calbridge-landing

  - it: carries a selector that never collides with the application's own
    template: templates/landing-deployment.yaml
    asserts:
      - notEqual:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: calbridge

  - it: sets the configured listen addresses, drain delay, log level and app url
    template: templates/landing-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_LISTEN_ADDR
            value: ":8081"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRAIN_DELAY
            value: "5s"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_URL
            value: "https://app.calbridge.example.org"

  - it: passes a different configured app url through unchanged
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          appUrl: "https://app.staging.example.org"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_URL
            value: "https://app.staging.example.org"

  - it: sets the five required operator variables
    template: templates/landing-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_NAME
            value: "Example Operator"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_STREET
            value: "Example Street 1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_POSTAL_CODE
            value: "12345"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_CITY
            value: "Example City"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_EMAIL
            value: "legal@calbridge.example.org"

  - it: renders no optional operator variable while its value is empty
    template: templates/landing-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_COUNTRY
            value: ""
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_PHONE
            value: ""
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_VAT_ID
            value: ""
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 10

  - it: renders each optional operator variable once its value is set
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator:
            country: "Germany"
            phone: "+49 30 0000000"
            representative: "Example Representative"
            register: "Example Register 1"
            vatId: "DE000000000"
            contentResponsible: "Example Editor"
            dataProtection: "privacy@calbridge.example.org"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_COUNTRY
            value: "Germany"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_PHONE
            value: "+49 30 0000000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_REPRESENTATIVE
            value: "Example Representative"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_REGISTER
            value: "Example Register 1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_VAT_ID
            value: "DE000000000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_CONTENT_RESPONSIBLE
            value: "Example Editor"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_DATA_PROTECTION
            value: "privacy@calbridge.example.org"

  - it: refuses to render when a required operator field is empty
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator:
            email: ""
    asserts:
      - failedTemplate:
          errorPattern: "operator/email"

  - it: refuses to render when the operator name holds only spaces
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator:
            name: "   "
    asserts:
      - failedTemplate:
          errorPattern: "operator/name.*does not match pattern"

  - it: refuses to render when the operator street holds only spaces
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator:
            street: "   "
    asserts:
      - failedTemplate:
          errorPattern: "operator/street.*does not match pattern"

  - it: refuses to render when the operator postal code holds only spaces
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator:
            postalCode: "   "
    asserts:
      - failedTemplate:
          errorPattern: "operator/postalCode.*does not match pattern"

  - it: refuses to render when the operator city holds only spaces
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator:
            city: "   "
    asserts:
      - failedTemplate:
          errorPattern: "operator/city.*does not match pattern"

  - it: refuses to render when the operator email holds only spaces
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator:
            email: "   "
    asserts:
      - failedTemplate:
          errorPattern: "operator/email.*does not match pattern"

  - it: refuses to render when the operator is not set at all
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator: null
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'operator'"

  - it: refuses a postal code that a values file wrote as a number
    template: templates/landing-deployment.yaml
    set:
      landing:
        config:
          operator:
            postalCode: 10115
    asserts:
      - failedTemplate:
          errorPattern: "operator/postalCode"

  - it: runs as non root with a read only root filesystem and no capabilities
    template: templates/landing-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: mounts no service account token
    template: templates/landing-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: has no startup probe but has liveness and readiness probes on the admin port
    template: templates/landing-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: admin
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: admin

  - it: has both the public and the admin container port
    template: templates/landing-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: admin
            containerPort: 8081
            protocol: TCP
