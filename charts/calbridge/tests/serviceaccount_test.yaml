suite: serviceAccount.create disabled
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
set:
  existingSecret:
    name: calbridge-secrets
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/calbridge?sslmode=require"
    databaseUser: calbridge_app
  migrationJob:
    databaseUser: calbridge_migrator
  serviceAccount:
    create: false
tests:
  - it: renders no ServiceAccount
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: the Deployment falls back to the default ServiceAccount
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: honours an explicit serviceAccount.name instead of the fallback
    template: templates/deployment.yaml
    set:
      serviceAccount:
        create: false
        name: existing-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-account
