suite: serviceAccount.create disabled
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
  - templates/landing-serviceaccount.yaml
  - templates/landing-deployment.yaml
set:
  existingSecret:
    name: calbridge-secrets
  landing:
    config:
      appUrl: "https://app.calbridge.example.org"
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/calbridge?sslmode=require"
    databaseUser: calbridge_app
  migrationJob:
    databaseUser: calbridge_migrator
  serviceAccount:
    create: false
tests:
  - it: renders no ServiceAccount
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: the Deployment falls back to the default ServiceAccount
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: honours an explicit serviceAccount.name instead of the fallback
    template: templates/deployment.yaml
    set:
      serviceAccount:
        create: false
        name: existing-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-account

  # The landing server carries its own serviceAccount values, independent
  # of the application's: landing.serviceAccount.create stays true in the
  # cases above, and the application's stays true in the cases below, so
  # each pair also shows the two keys do not reach across.
  - it: renders no landing ServiceAccount
    template: templates/landing-serviceaccount.yaml
    set:
      serviceAccount:
        create: true
      landing:
        serviceAccount:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: the landing Deployment falls back to the default ServiceAccount
    template: templates/landing-deployment.yaml
    set:
      serviceAccount:
        create: true
      landing:
        serviceAccount:
          create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: honours an explicit landing.serviceAccount.name instead of the fallback
    template: templates/landing-deployment.yaml
    set:
      serviceAccount:
        create: true
      landing:
        serviceAccount:
          create: false
          name: existing-landing-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-landing-account

  - it: still renders the landing ServiceAccount while only the application's is disabled
    template: templates/landing-serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
