suite: replicaCount and selector label stability
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: calbridge-secrets
  landing:
    config:
      appUrl: "https://app.calbridge.example.org"
      operator:
        name: "Example Operator"
        street: "Example Street 1"
        postalCode: "12345"
        city: "Example City"
        email: "legal@calbridge.example.org"
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/calbridge?sslmode=require"
    databaseUser: calbridge_app
  migrationJob:
    databaseUser: calbridge_migrator
tests:
  - it: defaults to one replica with stable selector labels
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: calbridge
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/version"]

  - it: honours an increased replica count
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
