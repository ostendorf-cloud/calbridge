suite: port and label validations
templates:
  - templates/validations.yaml
set:
  existingSecret:
    name: calbridge-secrets
  landing:
    config:
      appUrl: "https://app.calbridge.example.org"
      operator:
        name: "Example Operator"
        street: "Example Street 1"
        postalCode: "12345"
        city: "Example City"
        email: "legal@calbridge.example.org"
  config:
    databaseUrl: "postgres://postgres.example.svc:5432/calbridge?sslmode=require"
    databaseUser: calbridge_app
  migrationJob:
    databaseUser: calbridge_migrator
tests:
  - it: fails the render when migrationJob.databaseUser equals config.databaseUser
    set:
      migrationJob:
        databaseUser: calbridge_app
    asserts:
      - failedTemplate:
          errorMessage: >-
            migrationJob.databaseUser (calbridge_app) must not equal config.databaseUser: the
            application's own role must never own the tables row level security protects it
            from. See README.md.

  - it: fails the render when config.listenAddr and service.port disagree
    set:
      config:
        listenAddr: ":9000"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.listenAddr (:9000) and service.port (8080) disagree on the port: both
            must name the same container port.

  - it: fails the render when config.adminListenAddr and service.adminPort disagree
    set:
      config:
        adminListenAddr: ":9001"
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.adminListenAddr (:9001) and service.adminPort (8081) disagree on the
            port: both must name the same container port.

  - it: renders fine when every listen address matches its service port
    asserts:
      - hasDocuments:
          count: 0

  - it: fails the render when podLabels sets the selector's name label
    set:
      podLabels:
        app.kubernetes.io/name: evil
    asserts:
      - failedTemplate:
          errorMessage: >-
            podLabels must not set app.kubernetes.io/name: it collides with calbridge's own
            immutable selector label.

  - it: fails the render when podLabels sets the selector's instance label
    set:
      podLabels:
        app.kubernetes.io/instance: evil
    asserts:
      - failedTemplate:
          errorMessage: >-
            podLabels must not set app.kubernetes.io/instance: it collides with calbridge's
            own immutable selector label.

  - it: renders fine with an unrelated pod label
    set:
      podLabels:
        team: calendar
    asserts:
      - hasDocuments:
          count: 0

  # A configured provider with no existingSecret.name to read its client
  # secret from is refused by values.schema.json's own required and
  # minLength constraint on that field, before this template runs at all,
  # so there is no case for this file to add.
  - it: renders nothing of its own when a provider is configured
    set:
      config:
        auth:
          google:
            clientId: google-client-id
    asserts:
      - hasDocuments:
          count: 0

  - it: fails the render when landing.config.listenAddr and landing.service.port disagree
    set:
      landing:
        config:
          listenAddr: ":9000"
    asserts:
      - failedTemplate:
          errorMessage: >-
            landing.config.listenAddr (:9000) and landing.service.port (8080) disagree on
            the port: both must name the same container port.

  - it: fails the render when landing.config.adminListenAddr and landing.service.adminPort disagree
    set:
      landing:
        config:
          adminListenAddr: ":9001"
    asserts:
      - failedTemplate:
          errorMessage: >-
            landing.config.adminListenAddr (:9001) and landing.service.adminPort (8081)
            disagree on the port: both must name the same container port.

  - it: renders fine when every landing listen address matches its service port
    asserts:
      - hasDocuments:
          count: 0

  - it: fails the render when landing.podLabels sets the selector's name label
    set:
      landing:
        podLabels:
          app.kubernetes.io/name: evil
    asserts:
      - failedTemplate:
          errorMessage: >-
            landing.podLabels must not set app.kubernetes.io/name: it collides with the
            landing server's own immutable selector label.

  - it: fails the render when landing.podLabels sets the selector's instance label
    set:
      landing:
        podLabels:
          app.kubernetes.io/instance: evil
    asserts:
      - failedTemplate:
          errorMessage: >-
            landing.podLabels must not set app.kubernetes.io/instance: it collides with the
            landing server's own immutable selector label.

  - it: renders fine with an unrelated landing pod label
    set:
      landing:
        podLabels:
          team: calendar
    asserts:
      - hasDocuments:
          count: 0
