# Default values for calbridge.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/ostendorf-cloud/calbridge
  # Defaults to .Chart.AppVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # No RBAC is created: this application makes no Kubernetes API calls of its own.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Matches the Dockerfile's distroless "nonroot" base image, uid/gid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem is safe here: cmd/calbridge keeps no state on disk at
# all today (internal/config reads only the environment, internal/httpapi
# writes nothing), and the distroless base image needs no writable path of
# its own either.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Also used as the public container port: must match the port encoded in
  # config.listenAddr (default ":8080" for both). No probe targets this
  # port; see adminPort below.
  port: 8080
  # The second, administrative container port cmd/calbridge listens on
  # through govue's httpserver.RunAdmin: liveness, readiness and metrics
  # live here, nowhere on port above. Must match the port encoded in
  # config.adminListenAddr (default ":8081" for both).
  #
  # Exposed on the Service as its own named port (see templates/service.yaml);
  # templates/ingress.yaml and templates/httproute.yaml both still only ever
  # route to port above, never to this one, so a caller reaching this
  # application through either still cannot scrape its metrics or poll its
  # probes that way. Leaving this off the Service entirely would not
  # narrow that further: a pod IP is routable from anywhere in the cluster
  # regardless of whether the Service also exposes the port. Restricting
  # that for real is a NetworkPolicy, which this chart does not ship.
  adminPort: 8081

# Disabled by default. Enable at most one of ingress and httproute: the
# render fails with a readable message when both are enabled, rather than
# emitting two conflicting routes to the same Service (see
# templates/validations.yaml).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: calbridge.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# The Gateway API alternative to ingress above, for a cluster whose ingress
# controller is a Gateway rather than an Ingress controller. parentRefs names
# the Gateway (or Gateways) this HTTPRoute attaches to; hostnames narrows
# which of the Gateway's listeners it binds, matching the Gateway API's own
# HTTPRoute contract.
httproute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: ""
  hostnames: []

resources:
  requests:
    # A govue HTTP server with no background polling and no database pool
    # yet: light at idle, matching solobill's own baseline request for a
    # comparably small Go service.
    cpu: 100m
    memory: 128Mi
  limits:
    # No CPU limit: request handling is bursty, and a CPU limit would only
    # throttle the pod mid-request for being briefly busy, not for being
    # broken. A memory limit stays in place as a safety net against a
    # genuine leak.
    #
    # This number and internal/auth's MaxConcurrentPasswordHashes are one
    # decision, not two. Argon2id holds 64 MiB for the whole of each
    # derivation, and a finished derivation's block stays resident until
    # a later collection, so the peak is about twice the live blocks: the
    # one derivation that package allows at a time measures roughly
    # 128 MiB resident, half of this limit, and the other half is the Go
    # runtime, the embedded SPA, the pgx pool and the session store.
    #
    # Raising this alone buys no capacity, because the application still
    # runs one derivation at a time. Raising both together is the scaling
    # path when logins per second becomes a constraint: keep the live
    # blocks at a quarter of the limit, which keeps the resident peak at
    # half. internal/depsync's own test fails if either side moves
    # without the other, in both directions.
    memory: 256Mi

# Disabled by default: cmd/calbridge has no slow startup work in front of
# config.Load today. Enable this only for a deployment that adds one.
startupProbe:
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# periodSeconds times failureThreshold is the drain window: how long the
# Service and the route keep sending new connections to this pod after it
# starts shutting down, before Kubernetes removes it from Endpoints. At
# 2s times 1, that is 2 seconds; config.drainDelay (5s) stays above it, so
# govue's httpserver.Serve has already failed the readiness check for one
# full probe period before it closes the listener. A longer window here
# (for example the 10s/3 default periodSeconds and failureThreshold still
# used elsewhere in this chart) would need a correspondingly longer
# config.drainDelay to keep that ordering true.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 2
  failureThreshold: 1

nodeSelector: {}
tolerations: []
affinity: {}

# Must stay above config.drainDelay plus however long an in-flight request
# may take to finish once shutdown starts (httpserver.DefaultShutdownTimeout,
# 20s), so the kubelet never SIGKILLs the container before cmd/calbridge's
# own graceful shutdown sequence has a chance to finish on its own.
terminationGracePeriodSeconds: 30

# Plain, non-secret configuration, mapped 1:1 from internal/config.Config
# (see that package's own doc comment for the authoritative list).
config:
  listenAddr: ":8080"
  # ADMIN_LISTEN_ADDR: the second listener liveness, readiness and metrics
  # move to; see service.adminPort above for why it is not exposed through
  # the Ingress or the HTTPRoute. Must match service.adminPort.
  adminListenAddr: ":8081"
  # DRAIN_DELAY: must stay above readinessProbe.periodSeconds times
  # readinessProbe.failureThreshold; see readinessProbe's own comment
  # above for why.
  drainDelay: "5s"
  logLevel: "info"

  # TRUSTED_PROXY_CIDRS: comma separated CIDRs (or bare addresses) the
  # rate limiters trust to have appended the real client address to
  # X-Forwarded-For. Empty by default, which keys them on the TCP peer:
  # behind ingress.enabled or httproute.enabled that peer is the ingress
  # controller or Gateway data plane for every request, so each budget
  # ends up shared by every client instead of kept one per client. See
  # the chart's README for what to set this to when exposing the service
  # through either.
  trustedProxyCIDRs: ""

  # --------------------------------------------------------------------
  # Provider sign-in
  # --------------------------------------------------------------------
  # AUTH_BASE_URL: the public base URL of this deployment, for example
  # "https://calbridge.example.com". internal/auth builds every provider's
  # redirect URL from it as
  # "<AUTH_BASE_URL>/api/v1/auth/providers/<provider>/callback", and this
  # must match the redirect URL registered for the application at that
  # provider's own console. Empty by default, which is correct for a
  # deployment offering local accounts only; internal/config refuses to
  # start once a provider below is configured without it, rather than
  # building a redirect URL the provider would reject at the callback.
  # See README.md's "Provider sign-in" section.
  authBaseUrl: ""

  # PUBLIC_SITE_URL: the public landing page's own base URL, for example
  # "https://calbridge.example.com", matching landing.config.appUrl's
  # deployment one level up when both are installed together.
  # internal/httpapi renders it into the login screen and the signed-in
  # shell as the link back to the public site; internal/config.Config's
  # own PublicSiteURL doc comment carries the full reasoning. Empty by
  # default, which is correct for a deployment that has not published a
  # landing page (or runs this application standalone, as
  # docker-compose.yaml does): the frontend then renders no such link.
  publicSiteUrl: ""

  # Google, Microsoft and Apple sign-in, each independent and off by
  # default: a provider is offered only once its clientId below is set, at
  # which point its client secret becomes required too (see
  # existingSecret's own *ClientSecretKey comments below). Apple sign-in
  # grants identity and nothing else: no calendar is connected by it. An
  # iCloud calendar is connected separately over CalDAV with an Apple ID
  # and an app-specific password, because Apple has no calendar API
  # equivalent to Google Calendar or Microsoft Graph.
  auth:
    google:
      # AUTH_GOOGLE_CLIENT_ID. Empty by default; empty means Google
      # sign-in is simply not offered.
      clientId: ""
      # AUTH_GOOGLE_ISSUER. Empty by default, which makes internal/auth
      # use its own documented default Google issuer.
      issuer: ""
    microsoft:
      # AUTH_MICROSOFT_CLIENT_ID. Empty by default; empty means
      # Microsoft sign-in is simply not offered.
      clientId: ""
      # AUTH_MICROSOFT_ISSUER. Empty by default, which makes
      # internal/auth use its own documented default, multi-tenant
      # Microsoft issuer. Set this only for a tenant-specific issuer.
      issuer: ""
    apple:
      # AUTH_APPLE_CLIENT_ID. Empty by default; empty means Apple
      # sign-in is simply not offered.
      clientId: ""
      # AUTH_APPLE_ISSUER. Empty by default, which makes internal/auth
      # use its own documented default Apple issuer.
      issuer: ""

  # --------------------------------------------------------------------
  # Database
  # --------------------------------------------------------------------
  # databaseUrl is deliberately plain, not secret: internal/config.Config's
  # own doc comment defines DatabaseURL as "the connection URL without
  # credentials: scheme, host, port, database name and query parameters
  # only", with databaseUser and the secret-only database password below
  # assembled into it by internal/storage/postgres.NewPoolWithCredentials.
  #
  # Required (internal/config.Load calls l.Required("DATABASE_URL")); no
  # usable default exists for a database this chart does not provision.
  # Example: "postgres://postgres.example.svc:5432/calbridge?sslmode=require".
  databaseUrl: ""
  # databaseUser is plain too: a role name is not a credential by itself.
  # Required (l.Required("DATABASE_USER")).
  #
  # ------------------------------------------------------------------
  # The database role MUST be NOSUPERUSER and NOBYPASSRLS
  # ------------------------------------------------------------------
  # db/migrations enables FORCE ROW LEVEL SECURITY on every table that
  # references users. FORCE makes the policy bind even the table's own
  # owning role, but a Postgres superuser (or any role with BYPASSRLS) is
  # exempt from row level security regardless of FORCE. If the role
  # named here has either property, every row-level-security policy this
  # application depends on for per-user isolation provides no actual
  # protection, silently.
  #
  # Unlike docker-compose.yaml's own local Postgres, which this chart's
  # cluster-operated Postgres is not: that compose file brings its own
  # throwaway database and therefore has to script a second, restricted
  # role itself (docker/postgres/init-app-role.sh), on top of a bootstrap
  # superuser used only to run migrations. This chart's Postgres "already
  # runs in the cluster" instead: the cluster operator who provisions the
  # database and this role is responsible for making it NOSUPERUSER
  # NOBYPASSRLS, not this chart, which has no way to enforce that from
  # here.
  #
  # This role never runs db/migrations itself: migrationJob.databaseUser,
  # a required, separate role, owns every table this chart's schema
  # creates instead, so this role never owns a single one of them. See
  # README.md's "Migrations run as a separate role" section.
  databaseUser: ""

# This chart never creates a Secret from plaintext values (see README.md).
# Every secret-shaped setting is read from a Secret the installer already
# has, named here and referenced key by key, so a secret-manager operator
# that produces different key names is never forced into one shape.
existingSecret:
  # Required: name of the existing Secret carrying every key below.
  name: ""
  # Required keys: DATABASE_PASSWORD and ENCRYPTION_KEY have no fallback,
  # so a missing key in the referenced Secret surfaces as a real
  # Kubernetes error (CreateContainerConfigError) instead of a silently
  # empty value.
  #
  # The role named by config.databaseUser MUST be NOSUPERUSER and
  # NOBYPASSRLS; see config.databaseUser's own comment above for the full
  # reasoning.
  databasePasswordKey: "DATABASE_PASSWORD"
  # Hex encoded, exactly 32 bytes decoded (internal/config's own
  # encryptionKeyBytes, matching internal/storage/postgres's AES-256 key
  # length), for example generated with "openssl rand -hex 32". Encrypts
  # connections.credentials and event_mapping.encrypted_details at rest;
  # see db/migrations.
  encryptionKeyKey: "ENCRYPTION_KEY"
  # Password key for migrationJob.databaseUser, in this same Secret. Left
  # empty, the default, falls back to databasePasswordKey above, for a
  # migration role whose password happens to live under the same key.
  # Set this when the two roles' passwords live under different keys
  # instead; see README.md's "Migrations run as a separate role" section.
  migrationDatabasePasswordKey: ""
  # Client secret keys for provider sign-in, read only once the matching
  # config.auth.<provider>.clientId above is set (see
  # templates/deployment.yaml and templates/validations.yaml). Each
  # defaults to its own env var's name as the key, like
  # databasePasswordKey and encryptionKeyKey above.
  googleClientSecretKey: "AUTH_GOOGLE_CLIENT_SECRET"
  microsoftClientSecretKey: "AUTH_MICROSOFT_CLIENT_SECRET"
  appleClientSecretKey: "AUTH_APPLE_CLIENT_SECRET"

# A pre-install,pre-upgrade Helm hook Job that runs "dbmate up" against the
# same connection config.databaseUrl/databaseUser/existingSecret.name above
# configure, applying db/migrations (embedded into this chart as a
# ConfigMap, see templates/migration-configmap.yaml) before this chart's own
# Deployment is created or updated. pre-install,pre-upgrade, not just
# pre-install: an upgrade that adds a migration must not let the new image's
# pods start against the old schema. dbmate's own "up" command is
# idempotent (it tracks applied migrations in its own schema_migrations
# table), so re-running it against an already-migrated database on every
# upgrade is safe, not merely tolerated.
# The public landing page on calbridge.de: issue #44's own deployment,
# a static build with no session, no CSRF and no database, so a
# correction to the privacy policy's text never redeploys the
# application above. One deployment, one service, and either an
# Ingress or an HTTPRoute, mirroring the application's own shape one
# level down, under this key, rather than a second chart: the two
# ship from one image build and one release together, and a reader
# looking for "the other half of calbridge.de" finds it here instead
# of in a sibling chart nobody thought to look for.
landing:
  replicaCount: 1

  image:
    repository: ghcr.io/ostendorf-cloud/calbridge-landing
    # Defaults to .Chart.AppVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  serviceAccount:
    # No RBAC is created: this build makes no Kubernetes API calls of
    # its own either.
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # Safe for the same reason the application's own securityContext is:
  # cmd/calbridge-landing keeps no state on disk, and the distroless
  # base image needs no writable path of its own.
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    # Also the public container port: must match the port encoded in
    # landing.config.listenAddr (default ":8080" for both).
    port: 8080
    # The administrative container port, matching landing.config.adminListenAddr
    # (default ":8081" for both). Liveness, readiness and metrics live
    # here; templates/landing-ingress.yaml and templates/landing-httproute.yaml
    # only ever route to port above. See values.yaml's own service.adminPort
    # comment on the application above for the full reasoning, reproduced
    # here unchanged.
    adminPort: 8081

  # Disabled by default, mutually exclusive, exactly like the
  # application's own ingress/httproute pair above: the render fails
  # with a readable message when both are enabled (see
  # templates/validations.yaml).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: calbridge.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  httproute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: ""
    hostnames: []

  resources:
    requests:
      # Lighter than the application's own: this build serves static
      # files and nothing else, no database pool and no session store.
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  startupProbe:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30

  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 2
    failureThreshold: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  terminationGracePeriodSeconds: 30

  # Plain, non-secret configuration, mapped 1:1 from
  # internal/landingconfig.Config.
  config:
    listenAddr: ":8080"
    adminListenAddr: ":8081"
    drainDelay: "5s"
    logLevel: "info"
    # APP_URL: the application's own public base URL, for example
    # "https://app.calbridge.example.com". Required: internal/landingconfig.Load
    # refuses to start without it, and values.schema.json's own minLength
    # fails this chart's render before that ever runs. See
    # internal/landingconfig.Config.AppURL for what every page builds
    # from this value.
    appUrl: ""

migrationJob:
  enabled: true
  # Required: a separate, higher-privileged role that OWNS every table
  # db/migrations creates and applies them, distinct from
  # config.databaseUser (which the Deployment's pods connect as for
  # ordinary queries), mirroring docker-compose.yaml's own
  # bootstrap-superuser-for-migrations-only split. No usable default: a
  # role that is also config.databaseUser owns its own tables, and can,
  # precisely because it owns them, run
  # ALTER TABLE ... NO FORCE ROW LEVEL SECURITY or drop the policy
  # outright (PostgreSQL's ALTER TABLE reference: ownership is what that
  # command checks, FORCE notwithstanding), which is exactly the weaker
  # posture this chart no longer allows to render; see README.md.
  databaseUser: ""
  image:
    # The same official dbmate image docker-compose.yaml already uses
    # for its own "migrate" service, pinned to the same tag and the same
    # digest (docker-compose.yaml's own comment: "Pinned to 2.38.1, the
    # latest patch in the 2.38 line mise.toml already pins dbmate to"),
    # so Renovate's pinDigests keeps both in step with each other.
    repository: ghcr.io/amacneil/dbmate
    tag: "2.38.1"
    digest: "sha256:b0c8a87bfef4f2819fdb0a68ca357a44d12fb90d23eca695fcfc3b7e159cb1c5"
  annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
