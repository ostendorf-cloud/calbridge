{{- if .Values.landing.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "calbridge.landing.serviceAccountName" . }}
  labels:
    {{- include "calbridge.landing.labels" . | nindent 4 }}
  {{- with .Values.landing.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# This build makes no Kubernetes API call of its own, so no pod needs
# this token mounted at all; see templates/landing-deployment.yaml.
automountServiceAccountToken: false
{{- end -}}
