apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calbridge.fullname" . }}
  labels:
    {{- include "calbridge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "calbridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "calbridge.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "calbridge.serviceAccountName" . }}
      # This application makes no Kubernetes API calls of its own; see
      # values.yaml's serviceAccount.create comment.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            # See values.yaml's own adminPort comment: liveness, readiness
            # and metrics live here, and the probes below target this
            # port, never http above.
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: {{ .Values.config.listenAddr | quote }}
            - name: ADMIN_LISTEN_ADDR
              value: {{ .Values.config.adminListenAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DRAIN_DELAY
              value: {{ .Values.config.drainDelay | quote }}
            # No credentials here: internal/config.Config.DatabaseURL
            # carries no credentials by its own contract; DATABASE_USER
            # and DATABASE_PASSWORD below are assembled into a real
            # connection separately
            # (internal/storage/postgres.NewPoolWithCredentials). The
            # role named here MUST be NOSUPERUSER and NOBYPASSRLS; see
            # values.yaml's own comment on config.databaseUser.
            - name: DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: DATABASE_USER
              value: {{ .Values.config.databaseUser | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.databasePasswordKey }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.encryptionKeyKey }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.config.trustedProxyCIDRs | default "" | quote }}
            - name: AUTH_BASE_URL
              value: {{ .Values.config.authBaseUrl | quote }}
            - name: PUBLIC_SITE_URL
              value: {{ .Values.config.publicSiteUrl | quote }}
            # A provider's CLIENT_ID, ISSUER and CLIENT_SECRET render together,
            # only once its clientId is set: an unset clientId already means
            # "not offered" (see values.yaml), and omitting the block then
            # also keeps this chart from ever referencing a Secret key that an
            # install configuring no provider never carries.
            # existingSecret.name itself is required on every install
            # regardless (values.schema.json), since DATABASE_PASSWORD and
            # ENCRYPTION_KEY above come from it too, so a configured provider
            # always has a Secret to name here.
            {{- if .Values.config.auth.google.clientId }}
            - name: AUTH_GOOGLE_CLIENT_ID
              value: {{ .Values.config.auth.google.clientId | quote }}
            - name: AUTH_GOOGLE_ISSUER
              value: {{ .Values.config.auth.google.issuer | quote }}
            - name: AUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.googleClientSecretKey }}
            {{- end }}
            {{- if .Values.config.auth.microsoft.clientId }}
            - name: AUTH_MICROSOFT_CLIENT_ID
              value: {{ .Values.config.auth.microsoft.clientId | quote }}
            - name: AUTH_MICROSOFT_ISSUER
              value: {{ .Values.config.auth.microsoft.issuer | quote }}
            - name: AUTH_MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.microsoftClientSecretKey }}
            {{- end }}
            {{- if .Values.config.auth.apple.clientId }}
            - name: AUTH_APPLE_CLIENT_ID
              value: {{ .Values.config.auth.apple.clientId | quote }}
            - name: AUTH_APPLE_ISSUER
              value: {{ .Values.config.auth.apple.issuer | quote }}
            - name: AUTH_APPLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.appleClientSecretKey }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # Must stay above config.drainDelay plus the time httpserver.Serve's
      # own shutdown may take to let an in-flight request finish
      # (httpserver.DefaultShutdownTimeout, 20s): otherwise the kubelet
      # kills the container with SIGKILL before the graceful shutdown
      # sequence in cmd/calbridge's main has a chance to finish on its own.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
