apiVersion: v1
kind: Service
metadata:
  name: {{ include "calbridge.fullname" . }}
  labels:
    {{- include "calbridge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    # The admin listener (liveness, readiness, metrics). templates/ingress.yaml
    # and templates/httproute.yaml only ever reference .Values.service.port,
    # never this one, so routing to it still requires being inside the
    # cluster; see values.yaml's own service.adminPort comment.
    - port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
      name: admin
  selector:
    {{- include "calbridge.selectorLabels" . | nindent 4 }}
