{{- if .Values.httproute.enabled -}}
{{/*
A parentRefs entry naming no Gateway renders a syntactically valid but
useless HTTPRoute: nothing ever attaches it to a listener. Fail loudly
instead of installing a route that silently receives no traffic.
*/}}
{{- $hasParent := false -}}
{{- range .Values.httproute.parentRefs -}}
{{- if .name -}}
{{- $hasParent = true -}}
{{- end -}}
{{- end -}}
{{- if not $hasParent -}}
{{ fail "httproute.enabled is true but httproute.parentRefs names no Gateway: set at least one parentRefs entry's name." }}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "calbridge.fullname" . }}
  labels:
    {{- include "calbridge.labels" . | nindent 4 }}
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.httproute.parentRefs }}
    {{- if .name }}
    - name: {{ .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- with .Values.httproute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "calbridge.fullname" . }}
          port: {{ .Values.service.port }}
{{- end -}}
